name: Java CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        java: [ 8, 11, 17, 21 ]
        experimental: [false]
        include:
            - java: 25
              experimental: true
        
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - name: Build and Test with JaCoCo
      # تم استبدال الهدف الافتراضي بتشغيل الاختبارات مع توليد تقرير الجاكوكو
      run: mvn --errors --show-version --batch-mode --no-transfer-progress clean test

    - name: Run Mutation Testing (PiTest)
      # تشغيل اختبار الطفرات الذي جربناه محلياً
      run: mvn pitest:mutationCoverage

    - name: Upload Test Reports
      # رفع التقارير كملفات Artifacts لمشاهدتها في GitHub
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: reports-java-${{ matrix.java }}
        path: |
          target/site/jacoco/
          target/pit-reports/