name: Java CI

on:
  push:
    branches: [ "main" ] # سيعمل فقط عند الرفع المباشر لفرع main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8' # حددنا نسخة واحدة فقط لتقليل الزحام
        cache: maven

    - name: Build and Test with JaCoCo
      run: mvn --batch-mode clean test

    - name: Run Mutation Testing (PiTest)
      run: mvn --batch-mode pitest:mutationCoverage

    - name: Upload All Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: final-reports
        path: |
          target/site/jacoco/
          target/pit-reports/